name: Build Mapla File Manager APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -name '*.zip' -print -quit)
          test -n "$ZIP"
          mkdir source
          unzip -q "$ZIP" -d source

      - name: Align Java and Kotlin targets
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("source/MaplaFileManager-New/app/build.gradle.kts") 
          s = p.read_text()

          if "android {" not in s:
              raise SystemExit("Android configuration not found")

          addition = """android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          """

          s = s.replace("android {", addition, 1)
          p.write_text(s)
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p source/MaplaFileManager-New --no-daemon assembleDebug 

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mapla-File-Manager-APK
          path: source/MaplaFileManager-New/app/build/outputs/apk/debug/app-debug.apk 
